; HW6728 ESP32-S3 N16R8 — Bruce firmware target
[env:hw6728-n16r8]
board = esp32s3
board_build.partitions = partitions_hw6728_n16r8.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
build_src_filter = ${env.build_src_filter} +<../boards/hw6728-n16r8>
build_flags =
	${env.build_flags}
	-Iboards/hw6728-n16r8
	-DCORE_DEBUG_LEVEL=1
	-DBOARD_HAS_PSRAM=1
	-DUSE_DUMMY_TFT=1
	-DDEVICE_NAME='"HW6728 N16R8"'
